# Handoff Summary — plan §3.8 (always ends here)
# Live canvas source read back from Copilot Studio on 13 August 2026.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - I'm ready to check in
      - what happens next
      - summary please
  actions:
    - kind: SetMultipleVariables
      id: setVariable_C8IkLK
      assignments:
        - variable: Global.VisitType
          value: =Text(Global.VisitPurpose)

        - variable: Global.CompanyOrTPACode
          value: =Coalesce(Global.CompanyOrTPACode, "Not applicable")

        - variable: Global.MatchedPackageCode
          value: =Coalesce(Global.MatchedPackageCode, "Not applicable")

        - variable: Global.PayableAmount
          value: =Coalesce(Global.PayableAmount, 0)

        - variable: Global.MatchedPackageName
          value: =Substitute(Coalesce(Global.MatchedPackageName, "General consultation"), Char(34), "")

        - variable: Global.BillingCurrency
          value: =Substitute(Coalesce(Global.BillingCurrency, "SGD"), Char(34), "")

    - kind: InvokeFlowAction
      id: invokeFlowAction_F0WqYy
      input:
        binding:
          number: =Global.PayableAmount
          text: =Global.VisitType
          text_1: =Global.FullName
          text_2: =Global.CompanyOrTPACode
          text_3: =Global.MatchedPackageCode
          text_4: =Global.MatchedPackageName
          text_5: =Global.BillingCurrency

      output:
        binding:
          ticket_number: Topic.Ticketnumber
          verification_status: Topic.Verificationstatus

      flowId: 93526f13-ea96-f111-b8dc-7ced8dfec66f

    - kind: SendActivity
      id: sendHandoffSummary
      activity: "{Concatenate(\"Here is your pre-registration summary - please show this to the front-desk staff:\", Char(10), Char(10), \"- Visit type: \", Global.VisitType, Char(10), \"- Name (as claimed): \", Global.FullName, Char(10), \"- Matched package/coverage: \", Global.MatchedPackageName, \" (\", Global.MatchedPackageCode, \")\", Char(10), \"- Estimated cost: \", Global.BillingCurrency, \" \", Text(Global.PayableAmount), Char(10), \"- Queue reference: H4H-\", Topic.Ticketnumber, Char(10), \"- Status: \", Topic.Verificationstatus, Char(10), Char(10), \"Awaiting in-person identity verification and e-card/insurance card check by staff.\")}"

    - kind: EndDialog
      id: endHandoffSummary
      clearTopicQueue: true
